- name: Start App and Test Health
        run: |
          python app.py &
          sleep 3
          RESPONSE=$(curl -s http://127.0.0.1:8080)
          echo "App Output: $RESPONSE"
          
          if [[ "$RESPONSE" == *"Hello World"* ]]; then
            echo "✅ Web test passed!"
          else
            echo "❌ Web test failed!"
            exit 1
          fi
